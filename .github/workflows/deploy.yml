name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    # 每天北京时间凌晨 02:00 自动运行一次 (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 获取图床仓库最新的 CDN 版本号 (利用 GitHub 环境自带的 jq，速度极快)
      - name: Get latest CDN version
        id: cdn_version
        run: |
          LATEST_TAG=$(curl -s "https://api.github.com/repos/mkmkgo/nuanXinProPic/tags" | jq -r '.[0].name // "v1.2.18"')
          echo "version=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "✅ Got latest CDN version: $LATEST_TAG"

      # 2. 修改 constants.js 中的版本号
      - name: Update CDN version in constants.js
        run: |
          CDN_VERSION="${{ steps.cdn_version.outputs.version }}"
          sed -i "s/export const CDN_VERSION = '[^']*'/export const CDN_VERSION = '$CDN_VERSION'/" src/utils/config/constants.js
          echo "📦 Updated constants.js to: $CDN_VERSION"

      # 3. 克隆图床仓库数据 (利用 GitHub 内部网络，比 Cloudflare 脚本快得多)
      # fetch-depth: 10 获取最近10次提交，用于 git diff 查找新增图片
      - name: Checkout nuanXinProPic (wallpaper source)
        uses: actions/checkout@v4
        with:
          repository: mkmkgo/nuanXinProPic
          path: nuanXinProPic
          fetch-depth: 10

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. 同步数据到 public 目录 (确保打包时能包含这些 JSON 数据)
      - name: Copy data from image repository
        run: |
          mkdir -p public/data
          if [ -d "nuanXinProPic/data" ]; then
            echo "📦 Copying data from nuanXinProPic/data..."
            # 同步主系列
            for series in desktop mobile avatar; do
              if [ -d "nuanXinProPic/data/$series" ]; then
                cp -r "nuanXinProPic/data/$series" public/data/
              fi
              if [ -f "nuanXinProPic/data/$series.json" ]; then
                cp "nuanXinProPic/data/$series.json" public/data/
              fi
            done
            # 同步 Bing 数据
            if [ -d "nuanXinProPic/bing/meta" ]; then
              mkdir -p public/data/bing
              cp -r nuanXinProPic/bing/meta/* public/data/bing/
            fi
            echo "✅ Data copied successfully"
          else
            echo "⚠️ Data directory not found, fallback to pnpm sync"
            pnpm sync
          fi

      - name: Sync wallpaper assets to Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm sync:assets

      # 5. 执行 Vite 打包构建并生成关键路由静态 HTML
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build:seo

      # 6. 将构建产物推送到 Cloudflare Pages (核心步骤：解决 SEO 和 200 路由)
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: wallpaper-gallery-prod
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'

      # 7. 从 Supabase 生成最新 CDN 数据并同步到 nuanXinProPic（让小程序 CDN 能读到最新数据）
      - name: Generate CDN data from Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CDN_DATA_DIR: ${{ github.workspace }}/nuanXinProPic/data
        run: node scripts/generate-cdn-data.js

      - name: Sync data to nuanXinProPic and create tag
        id: sync_data
        run: |
          cd nuanXinProPic

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git diff --stat | grep -q "data/"; then
            echo "📤 Data changes detected, pushing to nuanXinProPic..."
            git add data/

            CURRENT_TAG=$(curl -s "https://api.github.com/repos/mkmkgo/nuanXinProPic/tags" | jq -r '.[0].name // "v1.3.0"')
            MAJOR=$(echo "$CURRENT_TAG" | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo "$CURRENT_TAG" | cut -d. -f2)
            PATCH=$(echo "$CURRENT_TAG" | cut -d. -f3)
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"

            git commit -m "sync: update wallpaper data from Supabase"
            git push
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
            echo "data_changed=true" >> $GITHUB_OUTPUT
            echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
            echo "✅ Successfully synced data to nuanXinProPic with tag $NEW_TAG"
          else
            echo "ℹ️ No data changes to sync"
            echo "data_changed=false" >> $GITHUB_OUTPUT
          fi
